# 复制后逐项改写；带「改」的字段必须换成真实值，否则 CI 的 schema 校验会失败
schema: aihw/solution@0.1
id: 0X-category.bailian                 # 改：<品类目录名>.bailian，如 06-ai-earphone.bailian
title: 品类名 · 百炼场景名               # 改
category: 0X-category                   # 改：01-ipc … 09-embodied
stack: bailian
kind: reference
summary: 一句话说清「设备输入 → 模型 → 设备输出」   # 改
models:
  - id: qwen3.8-flash                   # 改：实际调用的模型 ID，一个模型一项
    role: 这个模型在链路里做什么
regions: [cn-beijing, ap-southeast-1]   # 只写两地都核实过可用的地域
env: [DASHSCOPE_API_KEY]                # 必须走业务空间专属域名时加 DASHSCOPE_WORKSPACE_ID
device:
  inputs: [text]                        # 如 wav / mic / jpg / camera / mp3 / url / json
  outputs: [console]                    # 如 speaker / wav / markdown / json / console
run:
  setup: 仅标准库，无需安装             # 有依赖时写 pip install -r requirements.txt
  live: python3 run.py
  mock: python3 run.py --mock
metrics:
  first_token: 发出请求 → 首个 token     # 改：写清从哪个设备动作开始计时
  cost: usage × 模型单价（按地域）
verification:
  status: pending-live                  # 真跑并写入 VERIFY.md 后改为 live-verified
  last_verified: null                   # 真跑日期，如 2026-10-08
  record: VERIFY.md
license: MIT
compliance_tags: []                     # 如 minors / anthropomorphic / health / recording-consent / camera-privacy
maintainers: ["@smile-xuc"]
