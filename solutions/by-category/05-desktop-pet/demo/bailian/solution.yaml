schema: aihw/solution@0.1
id: 05-desktop-pet.bailian
title: 桌宠 · 百炼实时语音陪伴 + 记忆日记
category: 05-desktop-pet
stack: bailian
kind: reference
summary: 桌宠按键说话 → qwen3.8-omni-flash-realtime 实时语音回复，Function Calling 切换屏幕表情与动作；结束时 qwen3.7-flash 写陪伴日记、提炼记忆，下次开机注入
models:
  - id: qwen3.8-omni-flash-realtime
    role: 实时语音对话 + 工具调用 pet_expression（内置输入转写 qwen3-asr-flash-realtime）
  - id: qwen3.7-flash
    role: 陪伴日记与记忆提炼（OpenAI 兼容，流式 JSON，关闭思考）
regions: [cn-beijing, ap-southeast-1]
env: [DASHSCOPE_API_KEY, DASHSCOPE_WORKSPACE_ID]
device:
  inputs: [wav, mic]
  outputs: [speaker, wav, console, markdown, json]
run:
  setup: pip install -r requirements.txt
  live: python3 run.py
  mock: python3 run.py --mock
metrics:
  first_token: 松开按键（input_audio_buffer.commit）→ 首个 response.audio.delta，含 pet_expression 工具往返
  cost: 每轮 response.done.usage 之和 × 实时模型单价，取各轮均值；日记按 usage × qwen3.7-flash 单价另计
verification:
  status: pending-live
  last_verified: null
  record: VERIFY.md
license: MIT
compliance_tags: [anthropomorphic]
maintainers: ["@smile-xuc"]
