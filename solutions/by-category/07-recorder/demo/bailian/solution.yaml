schema: aihw/solution@0.2
id: 07-recorder.bailian
title: 录音卡 / 会议盒子 · 百炼录音纪要
category: 07-recorder
stack: bailian
kind: reference
summary: 录音卡会后上传录音 → qwen-audio-3.1-asr-flash-filetrans 转写（单声道分离说话人，双声道按音轨整理）→ qwen3.8-flash 生成摘要、决策和待办
models:
  - id: qwen-audio-3.1-asr-flash-filetrans
    role: 默认文件识别（单声道分离说话人，双声道保留两轨；WAV / MP3 探测声道，其他格式与 URL 必填 --channels 1/2）
  - id: qwen3.8-flash
    role: 默认结构化纪要（OpenAI 兼容，流式 JSON，关闭思考）
  - id: qwen-audio-3.1-asr-flash
    role: 显式 --sync 对比旧同步接口（短单声道 WAV / MP3，本地 Base64，≤3 分钟）
regions: [cn-beijing, ap-southeast-1]
env: [DASHSCOPE_API_KEY]
features: [voice-input, speaker-diarization, long-audio, structured-output]
experience:
  archetype: recorder
  cover: null
  variants:
    - id: default
      title: 会后转写 + 结构化纪要
      args: []
      services: [api, compatible]
hardware:
  parts:
    - part: mic
      role: 录会议
      simulated_by: samples/meeting.mp3 · --mic
    - part: button
      role: 录音键
      simulated_by: --mic 时按回车结束
    - part: led
      role: 录音指示灯
      simulated_by: 控制台「[设备]」行
  chips: []
  boards: []
device:
  inputs: [mp3, wav, m4a, mic, url]
  outputs: [markdown, json, console]
run:
  setup: 仅标准库，无需安装
  live: python3 run.py
  mock: python3 run.py --mock
metrics:
  first_token: 录音结束（开始上传）→ 纪要首个 token，含转写耗时
  cost: 完整有效输入 / 输出 Token usage × 地域单价；显式 0 合法，仅有时长或任一阶段用量不完整时总费用未知
  unit: 每次会议（样本 55 秒）
verification:
  status: pending-live
  last_verified: null
  record: VERIFY.md
license: MIT
compliance_tags: [recording-consent]
maintainers: ["@smile-xuc"]
