schema: aihw/solution@0.2
id: 07-recorder.bailian
title: 录音卡 / 会议盒子 · 百炼录音纪要
category: 07-recorder
stack: bailian
kind: reference
summary: 录音卡会后上传录音 → qwen-audio-3.1-asr-flash 转写并分离说话人 → qwen3.7-flash 流式生成结构化纪要卡片
models:
  - id: qwen-audio-3.1-asr-flash
    role: 同步转写 + 说话人分离（本地文件 Base64，demo 只用于 ≤3 分钟的录音）
  - id: qwen-audio-3.1-asr-flash-filetrans
    role: 异步转写 + 说话人分离（长录音经百炼临时存储 oss://，或 --audio-url 公网 URL；≤12 小时）
  - id: qwen3.7-flash
    role: 结构化纪要，默认档（OpenAI 兼容，流式 JSON，关闭思考）
  - id: qwen3.8-flash
    role: 结构化纪要，质量档（--quality）
regions: [cn-beijing, ap-southeast-1]
env: [DASHSCOPE_API_KEY]
features: [voice-input, speaker-diarization, long-audio, structured-output]
experience:
  archetype: recorder
  cover: null
  variants:
    - id: default
      title: 会后转写 + 结构化纪要
      args: []
      services: [api, compatible]
hardware:
  parts:
    - part: mic
      role: 录会议
      simulated_by: samples/meeting.mp3 · --mic
    - part: button
      role: 录音键
      simulated_by: --mic 时按回车结束
    - part: led
      role: 录音指示灯
      simulated_by: 控制台「[设备]」行
  chips: []
  boards: []
device:
  inputs: [mp3, wav, m4a, mic, url]
  outputs: [markdown, json, console]
run:
  setup: 仅标准库，无需安装
  live: python3 run.py
  mock: python3 run.py --mock
metrics:
  first_token: 录音结束（开始上传）→ 纪要首个 token，含转写耗时
  cost: 转写 usage + 纪要 usage × 模型单价（按地域）
  unit: 每次会议（样本 55 秒）
verification:
  status: pending-live
  last_verified: null
  record: VERIFY.md
license: MIT
compliance_tags: [recording-consent]
maintainers: ["@smile-xuc"]
