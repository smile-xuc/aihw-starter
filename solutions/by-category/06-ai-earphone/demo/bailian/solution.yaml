schema: aihw/solution@0.1
id: 06-ai-earphone.bailian
title: AI 耳机 · 百炼实时同传
category: 06-ai-earphone
stack: bailian
kind: reference
summary: 耳机麦克风收到的中文讲话按实时节奏推流 → qwen3.8-livetranslate-flash-realtime → 英文字幕增量 + 英文译音，自动区分说话人
models:
  - id: qwen3.8-livetranslate-flash-realtime
    role: 实时同传（原文识别 + 译文字幕 + 译音；默认 speaker_detection 断句并区分说话人）
regions: [cn-beijing, ap-southeast-1]
env: [DASHSCOPE_API_KEY, DASHSCOPE_WORKSPACE_ID]
device:
  inputs: [wav, mic]
  outputs: [console, speaker, wav, text]
run:
  setup: pip install -r requirements.txt
  live: python3 run.py
  mock: python3 run.py --mock
metrics:
  first_token: 首包音频发出（开口）→ 首条译文字幕（response.audio_transcript.delta / response.text.delta）
  cost: 各句 response.done.usage 之和 × 模型单价（按地域），另折算每分钟成本
verification:
  status: pending-live
  last_verified: null
  record: VERIFY.md
license: MIT
compliance_tags: [recording-consent]
maintainers: ["@smile-xuc"]
