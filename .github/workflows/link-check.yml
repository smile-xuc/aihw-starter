name: link-check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link check (relative + selected paths)
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee-action@v2 defaults to lychee 0.24.2, which errors on
          # --exclude-mail (unexpected argument). Mailto is unchecked unless
          # --include-mail is passed, so the flag is omitted.
          # Broken links must fail the job. The action prints lychee's
          # markdown report (Total / Successful / Errors / Excluded) to the log.
          fail: true
          format: markdown
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,204,206,429
            README.md CONTRIBUTING.md faq.md CHANGELOG.md
            awesome/**/*.md
            awesome/open-source/*.html
            solutions/**/*.md
            primer/**/*.md
            docs/*.html

      # Temporary: print HTTP status for the two exclude candidates.
      # Removed after the status codes are recorded. Not part of the check.
      - name: Probe candidate URL status codes
        if: always()
        continue-on-error: true
        run: |
          lychee --version
          printf '%s\n' \
            'https://www.androidauthority.com/halliday-g2-smart-glasses-launch-3689649/' \
            'https://www.qbitai.com/2025/10/341663.html' \
            | lychee --verbose --verbose --no-progress --mode plain --format detailed -
