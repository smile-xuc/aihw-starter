// Categories config
const CATEGORIES = [
  { id: "语音 AI", icon: "🎙️", label: "语音 AI 硬件" },
  { id: "视觉 AI", icon: "📷", label: "视觉 AI 硬件" },
  { id: "可穿戴 AI", icon: "⌚", label: "可穿戴 AI" },
  { id: "机器人", icon: "🤖", label: "机器人 / 具身智能" },
  { id: "模型部署", icon: "⚡", label: "模型部署 & 推理框架" },
  { id: "芯片平台", icon: "🧩", label: "芯片平台 & 开发板" },
  { id: "无人机", icon: "🚁", label: "无人机 AI" },
  { id: "显示创意", icon: "🖼️", label: "AI 显示 & 创意" },
  { id: "网络AI", icon: "🌐", label: "网络 & 基础设施 AI" },
  { id: "汽车AI", icon: "🚗", label: "自动驾驶 & 汽车 AI" },
  { id: "农业环境", icon: "🌱", label: "农业 & 环境 AI" },
  { id: "翻译设备", icon: "🌍", label: "AI 翻译设备" },
  { id: "参考合集", icon: "📚", label: "Awesome 合集 & 参考" },
];

// State
let activeFilters = new Set();
let searchQuery = "";

function render() {
  const content = document.getElementById("content");
  let html = "";
  let visibleCount = 0;

  CATEGORIES.forEach(cat => {
    let projects = PROJECTS.filter(p => p.category === cat.id);
    if (activeFilters.size > 0 && !activeFilters.has(cat.id)) return;
    if (searchQuery) {
      projects = projects.filter(p => {
        const q = searchQuery.toLowerCase();
        return p.name.toLowerCase().includes(q) ||
               p.desc.toLowerCase().includes(q) ||
               p.platform.toLowerCase().includes(q) ||
               p.features.some(f => f.toLowerCase().includes(q));
      });
    }
    if (projects.length === 0) return;

    projects.sort((a, b) => b.stars - a.stars);
    visibleCount += projects.length;

    html += `<div class="category" data-category="${cat.id}">
      <div class="category-header" onclick="toggleCategory(this)">
        <span class="category-icon">${cat.icon}</span>
        <span class="category-title">${cat.label}</span>
        <span class="category-count">${projects.length} 项目</span>
        <span class="category-toggle">▼</span>
      </div>
      <div class="projects-grid">`;

    projects.forEach(p => {
      html += `<div class="project-card">
        <a class="project-name" href="${p.url}" target="_blank">${p.name}</a>
        <div class="project-desc">${p.desc}</div>
        <div class="project-meta">
          <span class="meta-item"><span class="star">★</span> ${formatStars(p.stars)}</span>
          <span class="platform-badge">${p.platform}</span>
        </div>
        <div class="feature-tags">
          ${p.features.map(f => `<span class="feature-tag">${f}</span>`).join("")}
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  content.innerHTML = html;

  // Update stats
  document.getElementById("total-count").textContent = PROJECTS.length;
  document.getElementById("category-count").textContent = CATEGORIES.length;
  document.getElementById("top-stars").textContent = formatStars(Math.max(...PROJECTS.map(p => p.stars)));
}

function formatStars(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return n.toString();
}

function toggleCategory(el) {
  const grid = el.nextElementSibling;
  const toggle = el.querySelector(".category-toggle");
  grid.classList.toggle("hidden");
  toggle.classList.toggle("collapsed");
}

// Filter tags
function renderFilters() {
  const container = document.getElementById("filterTags");
  container.innerHTML = CATEGORIES.map(cat =>
    `<span class="tag ${activeFilters.has(cat.id) ? 'active' : ''}" data-id="${cat.id}" onclick="toggleFilter('${cat.id}')">${cat.icon} ${cat.label}</span>`
  ).join("");
}

function toggleFilter(id) {
  if (activeFilters.has(id)) activeFilters.delete(id);
  else activeFilters.add(id);
  renderFilters();
  render();
}

// Search
document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value.trim();
  render();
});

// Init
renderFilters();
render();
</script>
